spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:agent_platform}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}

#  ai:
#    openai:
#      api-key: ${OPENAI_API_KEY:sk-dev-placeholder}
#      base-url: ${OPENAI_BASE_URL:https://api.openai.com}

  ai:
    openai:
      # 通义千问 API Key（需要在阿里云控制台获取）
      api-key: ${OPENAI_API_KEY}
      # 通义千问兼容模式 endpoint
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}

milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}

logging:
  level:
    com.agent.platform: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.web.client.RestTemplate: DEBUG
    org.springframework.ai.openai: DEBUG
